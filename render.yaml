# Render Blueprint for the FitFam API (free plan). Contains no secrets: values marked `sync: false` are typed into the
# Render dashboard once. See the "Deploying to Render" section of README.md.
services:
  - type: web
    name: fitfam-api
    runtime: docker
    plan: free
    # Same region as the database (Frankfurt), so every query is fast.
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Database (Supabase session pooler). Enter in the dashboard.
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Google OAuth client ID (public, but kept as a setting).
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Signs login sessions. Render generates a random one; changing it logs everyone out.
      - key: JWT_SECRET
        generateValue: true
      # https origins of the sites that call the API from a browser (the admin app). Must not be localhost:
      # with secure cookies the API refuses to start otherwise.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      # A free instance has 512 MB and a tiny slice of one CPU: small heap, single-threaded GC, quick JIT.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseSerialGC -XX:MaxRAMPercentage=65 -XX:MaxMetaspaceSize=128m -XX:TieredStopAtLevel=1 -Xss512k -XX:+ExitOnOutOfMemoryError"
