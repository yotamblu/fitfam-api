spring.application.name=fitfam-api
server.port=${PORT:8081}

# Finish in-flight requests when the host stops the container (a deploy or spin-down sends SIGTERM).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Local development: read secrets from the gitignored .env file (KEY=value lines).
# In production the same names come from real environment variables (Railway).
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# The schema was first applied by hand; treat V1 as already applied.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.google.client-id=${GOOGLE_CLIENT_ID}
app.jwt.secret=${JWT_SECRET}
# Customer sessions slide: while a customer keeps using the app the API re-issues the cookie (see SessionAuthFilter),
# so they only sign in again after this many days of not opening it.
app.session.days=30
# Admin sessions are much shorter and never slide: sessions are stateless (no server-side revoke), so a stolen admin
# cookie should stop working soon.
app.session.admin-hours=12
app.cookie.secure=${COOKIE_SECURE:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Expose only the health check; never leak details, messages or stack traces.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Fitbot (AI assistant). The key and model come from the environment; the provider is called only from this server.
# FITBOT_ADMINS_ONLY stays true while the provider is on a free tier (free-tier prompts may be used by the provider).
app.fitbot.api-key=${GEMINI_API_KEY:}
app.fitbot.model=${GEMINI_MODEL:}
app.fitbot.enabled=${FITBOT_ENABLED:true}
app.fitbot.admins-only=${FITBOT_ADMINS_ONLY:true}
app.fitbot.daily-messages=${FITBOT_DAILY_MESSAGES:30}
app.fitbot.retention-days=${FITBOT_RETENTION_DAYS:100}
